<script>
/* ======================================================
   GLOBAL SITE LISTS (LOADED ONCE)[cite: 2]
====================================================== */
let WIKTIONARY_SITES = [];
let WIKIPEDIA_SITES = [];

function fetchWithTimeout(url, ms = 6000){
  return Promise.race([
    fetch(url),
    new Promise((_, reject) => setTimeout(() => reject("timeout"), ms))
  ]);
}

async function fetchJSON(url){
  const r = await fetchWithTimeout(url);
  return r.json();
}

async function loadWikimediaSites(){
  const data = await fetchJSON("https://meta.wikimedia.org/w/api.php?action=sitematrix&format=json&origin=*");
  const matrix = data.sitematrix;

  for(const key in matrix){
    if(key === "count") continue;
    const block = matrix[key];
    if(!block.site || !block.code) continue;

    const lang = block.code;
    block.site.forEach(site=>{
      if(site.closed || site.private) return;
      if(site.code === "wiktionary") WIKTIONARY_SITES.push(lang);
      if(site.code === "wiki") WIKIPEDIA_SITES.push(lang);
    });
  }
}

/* =========================================
   TITLE CLEANER CONFIG[cite: 2]
========================================= */
const FORBIDDEN_PREFIXES = [
  "user", "User", "template", "talk", "wikipedia", "wiktionary", "file", 
  "category", "help", "portal", "module", "modules", "Module", "Modules", 
  "mediawiki", "special", "draft", "book", "media", "image", "User talk", 
  "Template", "Talk", "benotzer", "benutzer", "benutzerin", "diskussion", 
  "vorlage", "usuario", "utilisateur", "modèle", "categoria", "участник", 
  "шаблон", "ithemplethi", "wiksyunaryo", "project", "thread", "comment",
  "Dalībnieka diskusija", "सदस्य", "Kategorie", "زٲژ", "Samfuri", "Модуль", 
  "모듈", "𐌽𐌹𐌿𐍄𐌰𐌽𐌳𐍃", "幫助", "Ikiyago c'uwukoresha", "विक्शनरी", "Pamaké", 
  "དཔེ་པང་།", "ᥗᥦᥛᥰ ᥙᥣ ᥘᥥᥐᥳ", "টেমপ্লেট", "Utilisader discussiun", "Dyskusja", 
  "Индекс", "Категорие", "Шаблон", "ⴰⵎⵙⴳⴷⴰⵍ ⵏ ⵓⵏⵙⵙⵎⵔⵙ"
];

function cleanTitle(title){
  if(!title) return title;
  let t = title.trim();

  while(true){
    const colonIndex = t.indexOf(":");
    if(colonIndex === -1) break;
    const prefix = t.slice(0, colonIndex);
    if(FORBIDDEN_PREFIXES.includes(prefix)){
      t = t.slice(colonIndex + 1).trim();
    } else {
      break; 
    }
  }

  if(!/^wiki$/i.test(t)) t = t.replace(/\s+wiki$/i, "");
  if(!/^Wiki$/i.test(t)) t = t.replace(/\s+Wiki$/i, "");

  return t.trim();
}

/* ======================================================
   WORD SOURCES (IDENTICAL TO RANDOM WORD ALGORITHM)[cite: 2]
====================================================== */
async function randomFromWiktionary(){
  const lang = WIKTIONARY_SITES[Math.floor(Math.random() * WIKTIONARY_SITES.length)];
  const data = await fetchJSON(`https://${lang}.wiktionary.org/w/api.php?action=query&list=random&rnlimit=1&format=json&origin=*`);
  return { word: cleanTitle(data.query.random[0].title), source: `Wiktionary (${lang})`, isFontGenerated: false };
}

async function randomFromWikipedia(){
  const lang = WIKIPEDIA_SITES[Math.floor(Math.random() * WIKIPEDIA_SITES.length)];
  const data = await fetchJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&list=random&rnlimit=1&format=json&origin=*`);
  return { word: cleanTitle(data.query.random[0].title), source: `Wikipedia (${lang})`, isFontGenerated: false };
}

const FANDOM_FILE_COUNT = 3234;
function randomFromFandom(){
  return new Promise((resolve, reject)=>{
    const fileIndex = Math.floor(Math.random() * FANDOM_FILE_COUNT) + 1;
    const fileUrl = `https://cdn.jsdelivr.net/gh/swrdfgd/RandomWords2/fandom/fandom_${fileIndex}.txt`;

    $.get(fileUrl).done(txt => {
        const lines = txt.split("\n").map(l => l.trim()).filter(Boolean);
        if(!lines.length) return reject("empty fandom file");
        const line = lines[Math.floor(Math.random() * lines.length)];
        const lastComma = line.lastIndexOf(",");
        if(lastComma === -1) return reject("invalid line");

        let wikiUrl = line.slice(lastComma + 1).trim();
        wikiUrl = wikiUrl.replace(/\/+$/, "").replace("http://", "https://");

        const api = `${wikiUrl}/api.php?origin=*&action=query&format=json&list=random&rnlimit=1&rnnamespace=0`;
        $.getJSON(api).done(data=>{
            const title = data?.query?.random?.[0]?.title;
            if(!title) return reject("no article");
            resolve({ word: cleanTitle(title), source: `Fandom`, isFontGenerated: false });
          }).fail(()=>reject("article api failed"));
      }).fail(()=>reject("fandom txt failed"));
  });
}

const WORDLIST_FILE_COUNT = 424;
const MOREWORDS_FILE_COUNT = 1100;
const MOREWORDS2_FILE_COUNT = 200;

function randomFromWordlist(){
  return new Promise((resolve, reject)=>{
    let fileIndex, fileUrl;
	if (Math.random() < 1/3){
		fileIndex = Math.floor(Math.random() * WORDLIST_FILE_COUNT) + 1;
		fileUrl = `https://cdn.jsdelivr.net/gh/swrdfgd/RandomWords2/wordlist/wordlist_${fileIndex}.txt`;
	} else if (Math.random() < 1/2){
		fileIndex = Math.floor(Math.random() * MOREWORDS_FILE_COUNT) + 1;
		fileUrl = `https://cdn.jsdelivr.net/gh/swrdfgd/RandomWords2/morewords/items_${fileIndex}.txt`;		
	} else {
		fileIndex = Math.floor(Math.random() * MOREWORDS2_FILE_COUNT) + 1;
		fileUrl = `https://cdn.jsdelivr.net/gh/swrdfgd/RandomWords2/morewords2/names_${fileIndex}.txt`;	
	}

    $.get(fileUrl).done(txt => {
        const lines = txt.split("\n").map(l => l.trim()).filter(Boolean);
        if(!lines.length) return reject("empty wordlist file");
        const line = lines[Math.floor(Math.random() * lines.length)];
		resolve({ word: line, source: `wordlist`, isFontGenerated: false });
      }).fail(()=>reject("wordlist txt failed"));
  });
}

function fallbackWord(){
  const chars = "abcdefghijklmnopqrstuvwxyz";
  let len = Math.floor(Math.random()*8)+3;
  let w = "";
  for(let i=0;i<len;i++){ w += chars[Math.floor(Math.random()*chars.length)]; }
  return { word: w, source: "Fallback Generator" };
}

/* ======================================================
   SELECTOR (TRY PER STAGE)[cite: 2]
====================================================== */
async function generateWord(){
  if(Math.random() < 0.5){
    try{ return await randomFromWiktionary(); } catch(e){ console.warn("Wiktionary failed"); }
  }
  if(Math.random() < 0.5){
    try{ return await randomFromWikipedia(); } catch(e){ console.warn("Wikipedia failed"); }
  }
  if(Math.random() < 0.5){
    try{ return await randomFromFandom(); } catch(e){ console.warn("Fandom failed"); }
  }
  if(Math.random() < 0.5){
    try{ return await randomFromWordlist(); } catch(e){ console.warn("Wordlist failed"); }
  }
  try{ 
      if(typeof randomWordFromFont === "function") return await randomWordFromFont(); 
  } catch(e){ console.warn("Font engine failed"); }
  
  return fallbackWord();
}

/* ======================================================
   OLD KEYWORD ALGORITHM (Search Anywhere)
====================================================== */
async function generateRandomKeyword() {
	var kata = await generateWord();
	var kataKunci = await kata["word"];
	while (Math.random() < 0.5){
	  kata = await generateWord();
	  kataKunci += ' ' + await kata["word"];
	}
    return kataKunci;
}

});

randomBtn.addEventListener("click", async () => {
    // Provide a brief visual loading indicator
    searchInput.value = "Fetching words..."; 
    randomBtn.style.pointerEvents = "none";
    randomBtn.style.opacity = "0.5";
    
    try {
        searchInput.value = await generateRandomKeyword();
    } catch(e) {
        searchInput.value = fallbackWord().word;
    }
    
    clearBtn.style.display = "flex";
    randomBtn.style.pointerEvents = "auto";
    randomBtn.style.opacity = "1";
    searchInput.focus();

    if (autoSearchToggle.checked) runSearch();
});
